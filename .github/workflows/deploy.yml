name: Export and deploy to Cloudflare R2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3.0
  R2_BUCKET: worldmaker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Export Godot Web build
        run: |
          mkdir -p build
          godot --headless --export-release "Web" build/index.html
          # The exported index.html references this via a <script src> tag
          # (export_presets.cfg's html/head_include) but Godot's exporter
          # only ships the engine's own output files, so it has to be
          # copied alongside them by hand.
          cp web/local-data-bridge.js build/local-data-bridge.js

      - name: Sync build to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          # Cloudflare's edge cache sits in front of R2 and, without an
          # explicit Cache-Control, can keep serving a stale file for hours
          # after a deploy -- a browser hard-refresh only bypasses the
          # browser's own cache, not that edge layer. "no-cache" still lets
          # browsers/Cloudflare cache the (large, rarely-content-changing)
          # engine files, but forces a revalidation request on each load, so
          # a new deploy is always actually visible.
          aws s3 sync build/ "s3://${R2_BUCKET}" --endpoint-url "$R2_ENDPOINT" --delete \
            --cache-control "no-cache, must-revalidate"
          # R2/aws-cli's extension-based content-type guessing doesn't reliably
          # know .wasm; force it so browsers can use streaming instantiation.
          # (aws s3 cp replaces metadata wholesale, so cache-control has to be
          # repeated here too.)
          aws s3 cp build/index.wasm "s3://${R2_BUCKET}/index.wasm" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/wasm \
            --cache-control "no-cache, must-revalidate"
